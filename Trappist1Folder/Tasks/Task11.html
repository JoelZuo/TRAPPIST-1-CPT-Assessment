<title>Name Loop</title>
</head>


<script language = "javascript">

var x = 1
var name = prompt("Enter your name")


alert("Run loop now ?")
while(x<3)
{
document.writeln(name, name)
alert("Next loop")
document.writeln("<br>")
x++ // This statement (x++) increases x by one
}

</script>
